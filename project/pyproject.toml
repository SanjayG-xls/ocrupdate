[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "level-bridge-stem"
version = "0.2.4"
description = "Offline adaptive STEM learning assistant (Namma AI Hackathon 2026, PS1) - ExecuTorch on Raspberry Pi 5"
requires-python = ">=3.10,<3.14"
dependencies = ["PyYAML==6.0.3"]

[project.optional-dependencies]
dev = ["pytest==9.1.1"]
pi = ["executorch==1.4.0", "transformers==4.57.1"]
ocr = ["Flask==3.1.2", "opencv-python-headless==4.12.0.88", "pytesseract==0.3.13", "Pillow==11.3.0"]

[project.scripts]
level-bridge = "level_bridge.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"level_bridge.ocr" = ["templates/*.html", "static/*.css", "static/*.js", "static/vendor/katex/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "tests"]
addopts = "-ra"
