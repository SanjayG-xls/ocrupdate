<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="csrf-token" content="{{ token }}"><title>Read text | Level Bridge STEM</title><link rel="stylesheet" href="/static/scan.css"><script defer src="/static/reader.js?v={{ asset_version }}"></script></head>
<body><header><strong>LEVEL BRIDGE STEM</strong><a href="/">Use webcam</a></header><main><h1>Read text from a photo</h1><p>Choose a clear photo of printed text. Tesseract reads it on this device.</p>
<section><label>Choose photo <input id="file" type="file" accept=".jpg,.jpeg,.png"></label><button id="read" disabled>Read text</button><p id="status" role="status" aria-live="polite">Choose your photo to begin.</p></section>
<div class="columns"><section><h2>Your photo</h2><div class="photo"><img id="photo" alt="Selected photo" hidden></div></section><section><h2>Extracted text</h2><textarea id="output" rows="22" placeholder="Your text will appear here. You can correct it before copying."></textarea><button id="copy" disabled>Copy text</button><button id="delete" disabled>Delete scan</button><p>Check the text against your photo before using it.</p></section></div></main></body></html>
